name: Supabase keepalive

on:
  schedule:
    - cron: '23 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  KEEPALIVE_URL: https://www.patagoniknatales.com/api/internal/supabase-health

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar endpoint protegido
        env:
          KEEPALIVE_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPALIVE_SECRET" ]; then
            echo "::error::Falta configurar el secret CRON_SECRET en GitHub Actions con el mismo valor usado en Vercel."
            exit 1
          fi
          curl --fail --silent --show-error \
            --location \
            --max-time 20 \
            --retry 2 \
            --header "Authorization: Bearer $KEEPALIVE_SECRET" \
            "$KEEPALIVE_URL"
